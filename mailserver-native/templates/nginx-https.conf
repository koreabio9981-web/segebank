# 2단계: HTTPS — 웹메일(Roundcube, PHP-FPM) + 메일러(listmonk)
server {
    listen 80;
    server_name mail.__DOMAIN__ webmail.__DOMAIN__ news.__DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name mail.__DOMAIN__;
    ssl_certificate     /etc/letsencrypt/live/mail.__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.__DOMAIN__/privkey.pem;
    location / { return 301 https://webmail.__DOMAIN__$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name webmail.__DOMAIN__;
    ssl_certificate     /etc/letsencrypt/live/webmail.__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webmail.__DOMAIN__/privkey.pem;

    root __RC_ROOT__;
    index index.php;
    client_max_body_size 30m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Roundcube 내부 폴더 차단
    location ~ ^/(config|temp|logs|bin|SQL|installer)/ { deny all; }
    location ~ /\. { deny all; }

    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_SOCK__;
    }
}

server {
    listen 443 ssl http2;
    server_name news.__DOMAIN__;
    ssl_certificate     /etc/letsencrypt/live/webmail.__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webmail.__DOMAIN__/privkey.pem;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
