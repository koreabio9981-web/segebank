<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소개뱅크 관리자 시안</title>
<link rel="stylesheet" href="assets/common.css">
<style>.side{background:#2a1838}</style>
</head>
<body>
<script src="assets/common.js"></script>
<script>
if (!DB.settings) DB.settings = {commission:12, wFee:3.3, wMin:10000, approve:'수동 승인', productReview:'바로 판매'};
const pending = () => DB.sellers.filter(s => s.status === '승인대기');

function decide(id, ok){
  const s = sellerBy(id);
  if (ok) { s.status = '승인'; s.decided = today(); s.reason = ''; save(); toast(`${s.company} 승인 완료. 판매자 알림 문자·메일 발송 (시안)`); rerender(); return; }
  modal(`${esc(s.company)} 반려`, [{name:'r', label:'반려 사유 (판매자에게 보입니다)', type:'textarea'}], v => {
    if (!v.r) { toast('반려 사유를 입력하세요'); return false; }
    s.status = '반려'; s.decided = today(); s.reason = v.r; save(); toast('반려했습니다'); rerender();
  }, '반려');
}
function suspend(id){
  const s = sellerBy(id);
  if (s.status === '정지') { s.status = '승인'; s.reason = ''; save(); toast('정지 해제'); return rerender(); }
  modal(`${esc(s.company)} 판매 정지`, [{name:'r', label:'정지 사유', type:'textarea'}], v => {
    if (!v.r) return false; s.status = '정지'; s.reason = v.r;
    DB.products.filter(p => p.seller === id && p.status === '판매중').forEach(p => p.status = '판매중지');
    save(); toast('정지했습니다. 이 판매자의 판매중 상품도 판매중지됩니다'); rerender();
  }, '정지');
}
function sellerDetail(id){
  const s = sellerBy(id);
  modal(`판매자 상세 · ${esc(s.company)}`, [], () => {}, '닫기');
  document.querySelector('.modal h3').insertAdjacentHTML('afterend', table([['항목', r => r[0]], ['내용', r => esc(r[1])]],
    [['신청번호', s.id], ['상호', s.company], ['대표자', s.ceo], ['사업자번호', s.bizNo], ['연락처', s.phone], ['이메일', s.email], ['주력 카테고리', s.cat], ['신청일', s.applied], ['서류', '사업자등록증.pdf · 통신판매업신고증.pdf (시안)']]));
}
const sellerName = id => esc(sellerBy(id)?.company || id);

sideApp({
  brand: '관리자',
  role: () => '관리자 · admin',
  menus: [
    ['운영', {
      dash: ['관리자 대시보드', () => kpis([['오늘 가입', '3명'], ['오늘 매출', won(1320000)], ['판매자 승인 대기', `<a href="#sellerApprove" style="color:var(--bad)">${pending().length}건</a>`],
          ['출금 신청(오늘)', DB.withdrawals.filter(w => w.st === '신청').length + '건'], ['신규 주문', DB.orders.filter(o => o.st === '결제완료').length + '건'], ['답변 대기 문의', DB.inquiries.filter(q => q.to === '관리자' && q.st === '답변대기').length + '건']])
        + card('월별 매출 (백만 원)', `<div style="display:flex;align-items:flex-end;gap:10px;height:150px;margin-bottom:24px">${[['6월', 32], ['7월', 41], ['8월', 38], ['9월', 52], ['10월', 61], ['11월', 58]].map(([m, v]) => `<div style="flex:1;height:${v / 61 * 100}%;background:var(--pri);border-radius:4px 4px 0 0;position:relative" title="${v}"><span style="position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--sub)">${m}</span></div>`).join('')}</div>`)
        + card('판매자 승인 대기', table([['신청일', r => r.applied], ['상호', r => esc(r.company)], ['카테고리', r => r.cat], ['처리', r => `<a class="btn sm" href="#sellerApprove">심사하기</a>`]], pending(), '대기 중인 신청이 없습니다'))],
    }],
    ['판매자', {
      sellerApprove: ['판매자 입점 승인', () => `<div class="steps"><div class="done">1. 판매자 신청</div><div class="on">2. 관리자 심사 (여기)</div><div>3. 승인 → 상품 등록 가능</div></div>`
        + card(`승인 대기 (${pending().length}건)`, `<p class="help">확인할 것: 사업자등록번호 진위(국세청 조회), 통신판매업 신고, 정산 계좌 예금주 = 상호, 취급 상품의 판매 가능 여부</p>`
          + table([['신청번호', r => r.id], ['신청일', r => r.applied], ['상호', r => esc(r.company)], ['대표자', r => esc(r.ceo)], ['사업자번호', r => r.bizNo], ['카테고리', r => r.cat],
            ['처리', r => `<button class="sm ghost" onclick="sellerDetail('${r.id}')">상세·서류</button> <button class="sm" onclick="decide('${r.id}',true)">승인</button> <button class="sm bad" onclick="decide('${r.id}',false)">반려</button>`]], pending(), '대기 중인 신청이 없습니다'))
        + card('최근 처리 내역', table([['신청번호', r => r.id], ['상호', r => esc(r.company)], ['처리일', r => r.decided], ['결과', r => badge(r.status)], ['사유', r => esc(r.reason) || '-']], DB.sellers.filter(s => s.decided).slice().reverse()))],
      sellers: ['판매자 목록', () => card(`전체 판매자 (${DB.sellers.length})`, `<div class="bar"><input placeholder="상호·사업자번호 검색"><select><option>전체 상태</option><option>승인</option><option>승인대기</option><option>반려</option><option>정지</option></select><button>검색</button></div>`
        + table([['번호', r => r.id], ['상호', r => esc(r.company)], ['대표자', r => esc(r.ceo)], ['상품 수', r => DB.products.filter(p => p.seller === r.id).length, 'r'], ['수수료', () => DB.settings.commission + '%', 'r'], ['상태', r => badge(r.status)],
          ['관리', r => `<button class="sm ghost" onclick="sellerDetail('${r.id}')">상세</button> ${r.status === '승인' || r.status === '정지' ? `<button class="sm ${r.status === '정지' ? '' : 'bad'}" onclick="suspend('${r.id}')">${r.status === '정지' ? '정지 해제' : '판매 정지'}</button>` : ''}`]], DB.sellers))],
      settle: ['판매자 정산', () => card('정산 (월 2회: 1~15일분 → 20일 지급, 16~말일분 → 다음 달 5일 지급, 시안)', `<div class="bar"><select style="max-width:280px"><option>2026-11 2차 (11/16~11/30)</option><option>2026-11 1차 (11/01~11/15)</option></select><button class="ghost" onclick="toast('구매확정 주문 기준으로 계산했습니다 (시안)')">정산 계산</button><button onclick="toast('정산 확정 · 지급 요청 (시안)')">정산 확정</button></div>`
        + table([['기간', r => r.period], ['판매자', r => sellerName(r.seller)], ['판매액', r => won(r.gross), 'r'], ['수수료', r => `${won(r.gross * r.rate / 100)} (${r.rate}%)`, 'r'], ['지급액', r => `<b>${won(r.gross * (100 - r.rate) / 100)}</b>`, 'r'], ['상태', r => badge(r.st)]], DB.settlements))],
    }],
    ['상품 · 주문', {
      products: ['전체 상품', () => card(`전체 상품 (${DB.products.length})`, `<div class="bar"><input placeholder="상품명 검색"><select><option>전체 판매자</option>${DB.sellers.filter(s => s.status === '승인').map(s => `<option>${esc(s.company)}</option>`).join('')}</select><select><option>전체 상태</option><option>판매중</option><option>품절</option><option>숨김</option><option>판매중지</option></select><button>검색</button></div>`
        + table([['', r => thumb(r, 'sm')], ['번호', r => r.no], ['상품명', r => esc(r.name)], ['판매자', r => sellerName(r.seller)], ['카테고리', r => r.cat], ['판매가', r => won(r.price), 'r'], ['PV', r => r.pv, 'r'], ['상태', r => badge(r.status)],
          ['관리', r => `<button class="sm ${r.status === '판매중지' ? '' : 'bad'}" onclick="blockP(${r.no})">${r.status === '판매중지' ? '판매 재개' : '판매 중지'}</button>`]], DB.products))],
      categories: ['카테고리', () => card('카테고리 관리', `<div class="bar"><input id="newcat" placeholder="새 카테고리 이름"><button onclick="addCat()">추가</button></div>`
        + table([['순서', (r, i) => i + 1], ['이름', r => r], ['상품 수', r => DB.products.filter(p => p.cat === r).length, 'r']], DB.categories))],
      orders: ['전체 주문', () => card('주문 목록', periodBar('<select><option>전체 상태</option><option>결제완료</option><option>배송준비</option><option>배송중</option><option>배송완료</option><option>구매확정</option></select>')
        + table([['주문번호', r => r.no], ['주문일', r => r.date], ['구매자', r => r.buyer], ['상품', r => esc(orderTitle(r))], ['판매자', r => [...new Set(r.items.map(([no]) => sellerName(productBy(no)?.seller)))].join(', ')], ['금액', r => won(orderTotal(r)), 'r'], ['상태', r => badge(r.st)], ['송장', r => r.track || '-']], DB.orders))],
    }],
    ['회원 · 수당', {
      members: ['회원 관리', () => card('회원 목록', `<div class="bar"><input placeholder="아이디 또는 이름"><select><option>전체 직급</option><option>다이아몬드</option><option>플래티넘</option><option>골드</option><option>실버</option><option>판매원</option></select><button>검색</button><button class="ghost">엑셀 내려받기</button></div>`
        + table([['아이디', r => r.id], ['이름', r => r.name], ['직급', r => r.grade], ['추천인', r => r.sponsor], ['누적 매출', r => won(r.sales), 'r'], ['PV', r => r.pv.toLocaleString(), 'r'], ['가입일', r => r.joined], ['상태', r => badge(r.status)],
          ['관리', r => `<button class="sm ghost" onclick="toast('직급은 매월 1일 누적 소실적 PV로 자동 판정됩니다. 예외 조정은 사유·감사 기록 필수 (시안)')">직급 이력</button> <button class="sm ghost" onclick="toast('${r.status === '정상' ? '정지' : '해제'} (시안)')">${r.status === '정상' ? '정지' : '해제'}</button>`]], DB.members))],
      tree: ['추천 계보도', () => card('기준 회원 선택', `<div class="bar"><select style="max-width:260px" onchange="treeOut.innerHTML=renderTree(this.value);centerTrees()">${DB.members.map(m => `<option value="${m.id}">${m.name} (${m.id})</option>`).join('')}</select></div><div class="tree" id="treeOut">${renderTree('kim01')}</div>`)],
      bonus: ['수당 정산', () => kpis([['오늘 새벽 정산(11/26분)', won(2184600)], ['11월 누적 지급률', '23.7%'], ['정산 대기(유보 10%) 합계', won(1352800)], ['연간 누적 지급률', '22.9% / 한도 35%']])
        + card('일간 정산 (매일 00:30 자동, 기준서 v0.4)', `<div class="notice-box ok">전날 구매 확정분을 자동 정산해 90%는 출금 가능, 10%는 정산 대기로 적립했습니다. 이상치 없음.</div>
          <div class="bar"><select style="max-width:240px"><option>2026-11-26 정산분</option><option>2026-11-25 정산분</option></select><button class="ghost" onclick="toast('정산 결과를 다시 계산해 비교했습니다 (시안)')">재계산 비교</button></div>`)
        + card('월말 확정 (매월 1일 계산 → 3일 반영)', `<div class="steps"><div class="done">1. 그달 지급률 계산</div><div class="on">2. 검토</div><div>3. 정산 대기 해제/조정</div></div>
          <p class="help">33% 이하 → 정산 대기 전액 해제 · 33% 초과 → (33% ÷ 지급률)로 조정, 정산 대기분에서 차감. 11월 예상 지급률 23.7% → 전액 해제 예정.</p>
          <button onclick="toast('11월 월말 확정 → 12/3 해제 예약 (시안)')">11월 확정 예약</button>`)
        + card('판매원별 계산 결과 (예시)', table([['판매원', r => r[0]], ['직급', r => r[1]], ['직추천 10%', r => won(r[2]), 'r'], ['매칭 5%', r => won(r[3]), 'r'], ['롤업', r => won(r[4]), 'r'], ['직급 보너스', r => won(r[5]), 'r'], ['합계', r => `<b>${won(r[2] + r[3] + r[4] + r[5])}</b>`, 'r'], ['자격', r => badge(r[6])]],
          [['kim01', '골드', 61000, 44000, 0, 0, '정상'], ['lee22', '실버', 21000, 18500, 0, 0, '정상'], ['yoon4', '실버', 23100, 9800, 0, 0, '정상'], ['park7', '판매원', 7400, 0, 0, 0, '정상'], ['jung5', '판매원', 0, 0, 0, 0, '정지']]))],
      withdraw: ['출금 승인 · 배치', () => card('오늘 출금 신청 (영업일 16:00 마감 → 다음 영업일 입금)', `<div class="bar"><button class="ghost" onclick="toast('자동 승인 규칙(100만 원 이하, 이상치 없음) 적용 (시안)')">자동 승인 적용</button><button class="ghost" onclick="toast('1차 승인 (시안)')">1차 승인</button><button onclick="toast('2차 승인 → 이체 파일 생성 (시안, 1차와 다른 관리자)')">2차 승인</button></div>
          <p class="help">원천징수 3.3%(소득세 3% + 지방소득세 0.3%) 차감 후 이체. 주민번호·계좌 미등록이나 잔액 마이너스는 보류, 이체 실패 시 잔액이 복원됩니다.</p>`
        + table([['번호', r => r.no], ['판매원', r => r.who], ['수당', r => won(r.amt), 'r'], ['원천징수', r => won(r.fee), 'r'], ['실지급', r => won(r.amt - r.fee), 'r'], ['계좌', r => r.bank], ['신청일', r => r.date], ['상태', r => badge(r.st)],
          ['조치', r => r.st === '보류' ? `<button class="sm ghost" onclick="toast('판매원에게 주민번호·계좌 등록 안내를 보냈습니다 (시안)')">등록 안내</button>` : '-']], DB.withdrawals))],
    }],
    ['게시판 · 설정', {
      notice: ['공지 관리', () => card('공지 작성', `<div class="form2"><div class="field"><label>제목</label><input id="nt"></div><div class="field"><label>대상</label><select id="nto"><option>전체</option><option>회원</option><option>판매자</option></select></div></div><div class="field"><label>내용</label><textarea id="nb" rows="3"></textarea></div><button onclick="addNotice()">등록</button>`)
        + card('공지 목록', table([['제목', r => esc(r.t)], ['대상', r => r.to], ['날짜', r => r.d]], DB.notices))],
      qna: ['문의 관리', () => card('회원 → 관리자 문의', table([['제목', r => esc(r.t)], ['회원', r => r.who], ['날짜', r => r.d], ['상태', r => badge(r.st)], ['답변', r => esc(r.a) || `<button class="sm" onclick="answer(${DB.inquiries.indexOf(r)})">답변</button>`]], DB.inquiries.filter(q => q.to === '관리자')))
        + card('판매자 상품 문의 (모니터링)', table([['제목', r => esc(r.t)], ['판매자', r => sellerName(r.to)], ['날짜', r => r.d], ['상태', r => badge(r.st)]], DB.inquiries.filter(q => q.to !== '관리자')))],
      settings: ['운영 설정', () => { const s = DB.settings; return card('판매자 정책', `<div class="form2">
          <div class="field"><label>판매 수수료(%)</label><input id="s1" type="number" value="${s.commission}"></div>
          <div class="field"><label>입점 승인 방식</label><select id="s2"><option ${s.approve === '수동 승인' ? 'selected' : ''}>수동 승인</option><option ${s.approve === '자동 승인' ? 'selected' : ''}>자동 승인</option></select></div>
          <div class="field"><label>상품 등록 시</label><select id="s5"><option ${s.productReview === '바로 판매' ? 'selected' : ''}>바로 판매</option><option ${s.productReview === '관리자 검수 후 판매' ? 'selected' : ''}>관리자 검수 후 판매</option></select></div></div>`)
        + card('수당 정산·출금 정책', `<div class="form2"><div class="field"><label>원천징수율(%) · 세법 기준</label><input id="s3" type="number" step="0.1" value="${s.wFee}"></div><div class="field"><label>최소 출금액(원) · 유보율 10% · 정산 00:30</label><input id="s4" type="number" value="${s.wMin}"></div></div>`)
        + `<button onclick="saveSettings()">설정 저장</button>`; }],
    }],
  ],
});

function blockP(no){ const p = productBy(no); p.status = p.status === '판매중지' ? (p.stock ? '판매중' : '품절') : '판매중지'; save(); rerender(); }
function addCat(){ const v = document.getElementById('newcat').value.trim(); if (!v) return; if (DB.categories.includes(v)) return toast('이미 있습니다'); DB.categories.push(v); save(); rerender(); }
function wd(no, st){ DB.withdrawals.find(w => w.no === no).st = st; save(); toast(st === '지급완료' ? '지급 처리했습니다' : '반려했습니다'); rerender(); }
function addNotice(){ const t = document.getElementById('nt').value.trim(); if (!t) return toast('제목을 입력하세요'); DB.notices.unshift({t, to:document.getElementById('nto').value, d:today(), body:document.getElementById('nb').value}); save(); rerender(); }
function answer(i){ modal('답변', [{name:'a', label:'답변', type:'textarea'}], v => { if (!v.a) return false; DB.inquiries[i].a = v.a; DB.inquiries[i].st = '답변완료'; save(); rerender(); }); }
function saveSettings(){ const g = id => document.getElementById(id).value; Object.assign(DB.settings, {commission:+g('s1'), approve:g('s2'), wFee:+g('s3'), wMin:+g('s4'), productReview:g('s5')}); save(); toast('저장했습니다'); }
</script>
</body>
</html>
