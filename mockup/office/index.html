<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEGE 오피스 시안</title>
<style>
  :root{--bg:#f4f6fa;--card:#fff;--ink:#1d2433;--sub:#6b7487;--line:#e3e7ef;--pri:#2457d6;--pri2:#e8eefc;--ok:#1a8f5a;--warn:#c27a00;--bad:#c23b3b;--side:#16213a}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:8px 14px;background:var(--pri);color:#fff}
  button.ghost{background:var(--pri2);color:var(--pri)}
  button.sm{padding:4px 10px;font-size:12px}
  input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;width:100%;background:#fff}
  /* 로그인 */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .login-box{background:var(--card);width:100%;max-width:380px;padding:32px;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
  .logo{font-weight:800;font-size:22px;color:var(--pri)}
  .logo span{color:var(--ink)}
  .tabs{display:flex;gap:6px;margin:20px 0}
  .tabs button{flex:1;background:var(--bg);color:var(--sub)}
  .tabs button.on{background:var(--pri);color:#fff}
  .field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
  .note{font-size:12px;color:var(--sub);margin-top:12px;text-align:center}
  /* 레이아웃 */
  #app{display:none;min-height:100vh}
  .side{position:fixed;inset:0 auto 0 0;width:220px;background:var(--side);color:#c9d2e6;padding:20px 0;overflow:auto}
  .side .logo{padding:0 20px 18px;color:#fff}.side .logo span{color:#8fb0ff}
  .side .role{margin:0 20px 14px;font-size:12px;background:rgba(255,255,255,.08);padding:6px 10px;border-radius:6px}
  .side a{display:block;padding:10px 20px}
  .side a.on,.side a:hover{background:rgba(255,255,255,.08);color:#fff}
  .main{margin-left:220px;padding:24px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}
  .top h1{font-size:20px;margin:0}
  .menu-btn{display:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
  .grid .card{margin:0}
  .kpi .l{color:var(--sub);font-size:12px}.kpi .v{font-size:22px;font-weight:700;margin-top:6px}
  .card h3{margin:0 0 12px;font-size:15px}
  .tbl{overflow-x:auto}
  table{width:100%;border-collapse:collapse;white-space:nowrap}
  th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}
  th{font-size:12px;color:var(--sub);font-weight:600;background:#fafbfd}
  td.r,th.r{text-align:right}
  .b{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px}
  .b.ok{background:#e4f5ec;color:var(--ok)}.b.warn{background:#fdf2dc;color:var(--warn)}.b.bad{background:#fbe5e5;color:var(--bad)}.b.n{background:var(--pri2);color:var(--pri)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input,.bar select{width:auto;flex:1;min-width:140px}
  .tree ul{list-style:none;padding-left:22px;border-left:1px dashed var(--line);margin:4px 0}
  .tree>ul{padding-left:0;border:0}
  .tree li{margin:6px 0}
  .node{display:inline-block;background:var(--pri2);border-radius:6px;padding:6px 10px}
  .node small{color:var(--sub);margin-left:6px}
  .chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px}
  .chart div{flex:1;background:var(--pri);border-radius:4px 4px 0 0;position:relative;min-width:16px}
  .chart div span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--sub)}
  .form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;display:none}
  .mock{font-size:11px;color:var(--warn);background:#fdf2dc;padding:4px 8px;border-radius:4px}
  @media (max-width:800px){
    .side{transform:translateX(-100%);transition:.2s;z-index:10}.side.open{transform:none}
    .main{margin-left:0;padding:16px}.menu-btn{display:inline-block}
    .form2{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- C-01 로그인 -->
<section id="login">
  <div class="login-box">
    <div class="logo">SEGE <span>오피스</span></div>
    <div class="tabs">
      <button class="on" data-role="member">회원</button>
      <button data-role="admin">관리자</button>
    </div>
    <div class="field"><label>아이디</label><input id="uid" placeholder="아이디 입력"></div>
    <div class="field"><label>비밀번호</label><input type="password" placeholder="비밀번호 입력"></div>
    <button style="width:100%" onclick="login()">로그인</button>
    <div class="note">시안 화면입니다. 아무 값이나 넣고 로그인하세요.</div>
  </div>
</section>

<section id="app">
  <nav class="side" id="side"></nav>
  <main class="main">
    <div class="top">
      <div style="display:flex;gap:10px;align-items:center">
        <button class="ghost menu-btn" onclick="side.classList.toggle('open')">☰</button>
        <h1 id="title"></h1>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <span class="mock">시안 · 샘플 데이터</span>
        <button class="ghost sm" onclick="logout()">로그아웃</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</section>
<div class="toast" id="toast"></div>

<script>
/* ===== 샘플 데이터 ===== */
const won = n => n.toLocaleString('ko-KR') + '원';
const D = {
  members:[
    {id:'kim01',name:'김민수',grade:'골드',sponsor:'root',status:'정상',joined:'2026-03-02',sales:4200000},
    {id:'lee22',name:'이서연',grade:'실버',sponsor:'kim01',status:'정상',joined:'2026-05-11',sales:1850000},
    {id:'park7',name:'박준호',grade:'일반',sponsor:'kim01',status:'정상',joined:'2026-07-20',sales:620000},
    {id:'choi3',name:'최유진',grade:'실버',sponsor:'lee22',status:'정지',joined:'2026-08-03',sales:1100000},
    {id:'jung5',name:'정하늘',grade:'일반',sponsor:'lee22',status:'정상',joined:'2026-10-15',sales:330000},
    {id:'han9',name:'한도윤',grade:'일반',sponsor:'park7',status:'정상',joined:'2026-11-01',sales:150000},
  ],
  products:[
    {code:'P-100',name:'기본 패키지',price:330000,pv:300,active:true},
    {code:'P-200',name:'프리미엄 패키지',price:990000,pv:900,active:true},
    {code:'P-300',name:'건강식품 세트',price:120000,pv:100,active:false},
  ],
  orders:[
    {no:'O-24112601',who:'kim01',item:'프리미엄 패키지',amt:990000,date:'2026-11-26',st:'결제완료'},
    {no:'O-24112502',who:'lee22',item:'기본 패키지',amt:330000,date:'2026-11-25',st:'배송중'},
    {no:'O-24112003',who:'park7',item:'건강식품 세트',amt:120000,date:'2026-11-20',st:'배송완료'},
    {no:'O-24111504',who:'kim01',item:'기본 패키지',amt:330000,date:'2026-11-15',st:'배송완료'},
  ],
  bonuses:[
    {period:'2026-11 2주',type:'추천 수당',amt:85000,st:'지급완료'},
    {period:'2026-11 2주',type:'직급 수당',amt:42000,st:'지급완료'},
    {period:'2026-11 3주',type:'추천 수당',amt:61000,st:'정산중'},
    {period:'2026-11 3주',type:'매칭 수당',amt:23000,st:'정산중'},
  ],
  withdrawals:[
    {no:'W-0031',who:'kim01',amt:300000,fee:9900,date:'2026-11-24',st:'대기'},
    {no:'W-0030',who:'lee22',amt:150000,fee:4950,date:'2026-11-22',st:'승인'},
    {no:'W-0029',who:'park7',amt:50000,fee:1650,date:'2026-11-18',st:'반려'},
  ],
  notices:[
    {t:'12월 정산 일정 안내',d:'2026-11-25',body:'12월 정산은 매주 화요일에 진행됩니다.'},
    {t:'연말 프로모션 시작',d:'2026-11-20',body:'프리미엄 패키지 구매 시 추가 포인트를 드립니다.'},
    {t:'개인정보 처리방침 변경',d:'2026-11-01',body:'변경된 방침은 12월 1일부터 적용됩니다.'},
  ],
  inquiries:[
    {t:'출금 처리 기간 문의',who:'lee22',d:'2026-11-25',st:'답변대기',a:''},
    {t:'배송지 변경 요청',who:'park7',d:'2026-11-21',st:'답변완료',a:'변경 처리했습니다.'},
  ],
};
const badge = s => {
  const m={정상:'ok',지급완료:'ok',승인:'ok',배송완료:'ok',답변완료:'ok',판매중:'ok',
           대기:'warn',정산중:'warn',결제완료:'n',배송중:'n',답변대기:'warn',
           정지:'bad',반려:'bad',중지:'bad'};
  return `<span class="b ${m[s]||'n'}">${s}</span>`;
};
const table = (cols, rows) => `<div class="tbl"><table><thead><tr>${cols.map(c=>`<th class="${c[2]||''}">${c[0]}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c[2]||''}">${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const kpis = arr => `<div class="grid">${arr.map(([l,v])=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')}</div>`;
const card = (h, body) => `<div class="card"><h3>${h}</h3>${body}</div>`;
const toast = msg => { const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',1800); };

/* 조직도 */
function tree(root){
  const kids = D.members.filter(m=>m.sponsor===root);
  if(!kids.length) return '';
  return `<ul>${kids.map(k=>`<li><span class="node">${k.name} (${k.id})<small>${k.grade}</small></span>${tree(k.id)}</li>`).join('')}</ul>`;
}

/* ===== 회원 화면 ===== */
const MEMBER = {
  dash:['대시보드',()=> kpis([['이번 달 수당',won(211000)],['출금 가능 금액',won(468000)],['하위 회원',D.members.filter(m=>m.sponsor!=='root').length+'명'],['누적 PV','1,500']])
    + card('최근 공지', table([['제목',r=>r.t],['날짜',r=>r.d]], D.notices))
    + card('최근 수당', table([['기간',r=>r.period],['종류',r=>r.type],['금액',r=>won(r.amt),'r'],['상태',r=>badge(r.st)]], D.bonuses.slice(0,3)))],
  me:['내 정보',()=> card('기본 정보',`<div class="form2">
      <div class="field"><label>아이디</label><input value="kim01" disabled></div>
      <div class="field"><label>이름</label><input value="김민수"></div>
      <div class="field"><label>휴대폰</label><input value="010-1234-5678"></div>
      <div class="field"><label>이메일</label><input value="sample@example.com"></div>
      <div class="field"><label>은행</label><select><option>국민은행</option><option>신한은행</option><option>농협</option></select></div>
      <div class="field"><label>계좌번호</label><input value="123-456-7890"></div></div>
      <button onclick="toast('저장했습니다 (시안)')">저장</button>`)
    + card('비밀번호 변경',`<div class="form2"><div class="field"><label>현재 비밀번호</label><input type="password"></div><div></div>
      <div class="field"><label>새 비밀번호</label><input type="password"></div><div class="field"><label>새 비밀번호 확인</label><input type="password"></div></div>
      <button onclick="toast('변경했습니다 (시안)')">변경</button>`)],
  tree:['조직도',()=> card('내 조직 (kim01 기준)',`<div class="tree"><ul><li><span class="node">김민수 (kim01)<small>골드 · 나</small></span>${tree('kim01')}</li></ul></div>`)],
  bonus:['수당 내역',()=> card('조회',`<div class="bar"><input type="month" value="2026-11"><select><option>전체 종류</option><option>추천 수당</option><option>직급 수당</option><option>매칭 수당</option></select><button>조회</button></div>`
    + table([['기간',r=>r.period],['종류',r=>r.type],['금액',r=>won(r.amt),'r'],['상태',r=>badge(r.st)]], D.bonuses)
    + `<p style="text-align:right;font-weight:700">합계 ${won(D.bonuses.reduce((s,b)=>s+b.amt,0))}</p>`)],
  orders:['주문 내역',()=> card('내 주문', table([['주문번호',r=>r.no],['상품',r=>r.item],['금액',r=>won(r.amt),'r'],['주문일',r=>r.date],['상태',r=>badge(r.st)]], D.orders.filter(o=>o.who==='kim01')))],
  withdraw:['출금 신청',()=> card('출금 신청',`<p>출금 가능 금액: <b>${won(468000)}</b> · 수수료 3.3%</p>
      <div class="bar"><input id="wamt" type="number" placeholder="신청 금액" oninput="wfee.textContent=won(Math.round((+this.value||0)*0.033))"><button onclick="toast('출금 신청 완료 (시안)')">신청</button></div>
      <p style="color:var(--sub)">예상 수수료: <span id="wfee">0원</span></p>`)
    + card('신청 내역', table([['번호',r=>r.no],['금액',r=>won(r.amt),'r'],['수수료',r=>won(r.fee),'r'],['신청일',r=>r.date],['상태',r=>badge(r.st)]], D.withdrawals))],
  notice:['공지사항',()=> card('공지 목록', D.notices.map(n=>`<details style="border-bottom:1px solid var(--line);padding:10px 0"><summary><b>${n.t}</b> <span style="color:var(--sub);font-size:12px">${n.d}</span></summary><p>${n.body}</p></details>`).join(''))],
  qna:['1:1 문의',()=> card('문의하기',`<div class="field"><label>제목</label><input></div><div class="field"><label>내용</label><textarea rows="4"></textarea></div><button onclick="toast('문의 등록 (시안)')">등록</button>`)
    + card('내 문의', table([['제목',r=>r.t],['날짜',r=>r.d],['상태',r=>badge(r.st)],['답변',r=>r.a||'-']], D.inquiries))],
};

/* ===== 관리자 화면 ===== */
const ADMIN = {
  dash:['관리자 대시보드',()=> kpis([['오늘 가입','3명'],['오늘 매출',won(1320000)],['출금 대기',D.withdrawals.filter(w=>w.st==='대기').length+'건'],['답변 대기 문의',D.inquiries.filter(q=>q.st==='답변대기').length+'건']])
    + card('월별 매출 (백만 원)',`<div class="chart" style="margin-bottom:24px">${[['6월',32],['7월',41],['8월',38],['9월',52],['10월',61],['11월',58]].map(([m,v])=>`<div style="height:${v/61*100}%" title="${v}"><span>${m}</span></div>`).join('')}</div>`)
    + card('최근 주문', table([['주문번호',r=>r.no],['회원',r=>r.who],['금액',r=>won(r.amt),'r'],['상태',r=>badge(r.st)]], D.orders))],
  members:['회원 관리',()=> card('회원 목록',`<div class="bar"><input placeholder="아이디 또는 이름 검색"><select><option>전체 등급</option><option>골드</option><option>실버</option><option>일반</option></select><button>검색</button><button class="ghost">엑셀 내려받기</button></div>`
    + table([['아이디',r=>r.id],['이름',r=>r.name],['등급',r=>r.grade],['추천인',r=>r.sponsor],['누적 매출',r=>won(r.sales),'r'],['가입일',r=>r.joined],['상태',r=>badge(r.status)],
      ['관리',r=>`<button class="sm ghost" onclick="toast('${r.name} 상세 (시안)')">상세</button> <button class="sm ghost" onclick="toast('${r.status==='정상'?'정지':'해제'} 처리 (시안)')">${r.status==='정상'?'정지':'해제'}</button>`]], D.members))],
  tree:['조직도 조회',()=> card('기준 회원 선택',`<div class="bar"><select id="troot" onchange="treeOut.innerHTML=renderTree(this.value)">${D.members.map(m=>`<option value="${m.id}">${m.name} (${m.id})</option>`).join('')}</select></div><div class="tree" id="treeOut">${renderTree('kim01')}</div>`)],
  orders:['주문 관리',()=> card('주문 목록',`<div class="bar"><input type="date" value="2026-11-01"><input type="date" value="2026-11-26"><select><option>전체 상태</option><option>결제완료</option><option>배송중</option><option>배송완료</option></select><button>조회</button></div>`
    + table([['주문번호',r=>r.no],['회원',r=>r.who],['상품',r=>r.item],['금액',r=>won(r.amt),'r'],['주문일',r=>r.date],['상태',r=>badge(r.st)],
      ['변경',r=>`<select style="width:auto" onchange="toast('상태 변경 (시안)')"><option>${r.st}</option><option>결제완료</option><option>배송중</option><option>배송완료</option><option>취소</option></select>`]], D.orders))],
  settle:['수당 정산',()=> card('정산 실행',`<div class="bar"><select><option>2026-11 4주 (11/22 ~ 11/28)</option><option>2026-11 3주</option></select><button class="ghost" onclick="toast('계산 완료 (시안)')">계산하기</button><button onclick="toast('정산 확정 (시안)')">확정</button></div>
      <p style="color:var(--sub);font-size:12px">※ 수당 계산 규칙은 실제 규정을 받은 뒤 구현합니다.</p>`)
    + card('계산 결과 (예시)', table([['회원',r=>r.id],['추천 수당',r=>won(Math.round(r.sales*0.05)),'r'],['직급 수당',r=>won(Math.round(r.sales*0.02)),'r'],['합계',r=>`<b>${won(Math.round(r.sales*0.07))}</b>`,'r']], D.members.filter(m=>m.status==='정상')))],
  withdraw:['출금 승인',()=> card('출금 신청 목록', table([['번호',r=>r.no],['회원',r=>r.who],['신청액',r=>won(r.amt),'r'],['수수료',r=>won(r.fee),'r'],['실지급',r=>won(r.amt-r.fee),'r'],['신청일',r=>r.date],['상태',r=>badge(r.st)],
      ['처리',r=>r.st==='대기'?`<button class="sm" onclick="toast('승인 (시안)')">승인</button> <button class="sm ghost" onclick="toast('반려 (시안)')">반려</button>`:'-']], D.withdrawals))],
  products:['상품 관리',()=> card('상품 등록',`<div class="form2"><div class="field"><label>상품명</label><input></div><div class="field"><label>가격</label><input type="number"></div><div class="field"><label>PV(실적 포인트)</label><input type="number"></div><div class="field"><label>판매 상태</label><select><option>판매중</option><option>중지</option></select></div></div><button onclick="toast('상품 등록 (시안)')">등록</button>`)
    + card('상품 목록', table([['코드',r=>r.code],['상품명',r=>r.name],['가격',r=>won(r.price),'r'],['PV',r=>r.pv,'r'],['상태',r=>badge(r.active?'판매중':'중지')],['관리',()=>`<button class="sm ghost">수정</button>`]], D.products))],
  notice:['공지 관리',()=> card('공지 작성',`<div class="field"><label>제목</label><input></div><div class="field"><label>내용</label><textarea rows="4"></textarea></div><button onclick="toast('공지 등록 (시안)')">등록</button>`)
    + card('공지 목록', table([['제목',r=>r.t],['날짜',r=>r.d],['관리',()=>`<button class="sm ghost">수정</button> <button class="sm ghost">삭제</button>`]], D.notices))],
  qna:['문의 관리',()=> card('문의 목록', table([['제목',r=>r.t],['회원',r=>r.who],['날짜',r=>r.d],['상태',r=>badge(r.st)],['답변',r=>r.a||`<button class="sm" onclick="toast('답변 창 (시안)')">답변하기</button>`]], D.inquiries))],
};
function renderTree(id){ const m=D.members.find(x=>x.id===id); return `<ul><li><span class="node">${m.name} (${m.id})<small>${m.grade}</small></span>${tree(id)}</li></ul>`; }

/* ===== 화면 전환 ===== */
let role='member';
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); role=b.dataset.role;
});
const side=document.getElementById('side');
function login(){ location.hash = role+'/dash'; }
function logout(){ location.hash=''; }
function render(){
  const [r,page]=location.hash.slice(1).split('/');
  const map = r==='admin'?ADMIN:r==='member'?MEMBER:null;
  document.getElementById('login').style.display = map?'none':'flex';
  document.getElementById('app').style.display = map?'block':'none';
  if(!map) return;
  const key = map[page]?page:'dash';
  side.innerHTML = `<div class="logo">SEGE <span>오피스</span></div><div class="role">${r==='admin'?'관리자 · admin':'회원 · 김민수(kim01)'}</div>`
    + Object.entries(map).map(([k,[t]])=>`<a href="#${r}/${k}" class="${k===key?'on':''}">${t}</a>`).join('');
  side.classList.remove('open');
  document.getElementById('title').textContent = map[key][0];
  document.getElementById('view').innerHTML = map[key][1]();
}
window.addEventListener('hashchange',render); render();
</script>
</body>
