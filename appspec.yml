# AWS CodeDeploy 배포 설정 (EC2 / Amazon Linux)
version: 0.0
os: linux

files:
  - source: /
    destination: /home/ec2-user/segebank
file_exists_behavior: OVERWRITE

permissions:
  - object: /home/ec2-user/segebank
    owner: ec2-user
    group: ec2-user

hooks:
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 60
      runas: ec2-user
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: ec2-user
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 60
      runas: ec2-user
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 120
      runas: ec2-user
